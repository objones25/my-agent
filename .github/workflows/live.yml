# The suite ci.yml deliberately excludes, run on a schedule instead.
#
# Why this exists: docs/findings.md is forty-five entries of verified library
# and provider behaviour, and CLAUDE.md requires re-verifying it after anything
# moves. The `-m live` suite is the only thing that exercises the Hugging Face
# router, LangSmith and Weave, so without a scheduled run nothing re-checks any
# of it -- drift would surface whenever someone next happened to run it by hand.
#
# It stays out of the offline gate on purpose: it needs the network and costs
# money per run, so it must not gate a commit or a pull request.
name: live

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a live run in flight: it has already spent tokens.
concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    # Generous on purpose. The `-m live` suite itself takes about four seconds,
    # but weave's atexit handler waits on a hardcoded 300s flush that cannot be
    # bounded from code (docs/findings.md F23), and this workflow now pays that
    # twice -- once per process. The first real run took 5m51s with one process
    # and no repeats.
    #
    # The 45 is an ESTIMATE, not a measurement: 8 checks x 5 attempts is ~40
    # live turns whose duration has never been recorded, plus the second 300s
    # flush. Replace it with the observed number after the first real run --
    # the 20 above was measured, and this is not yet.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install the locked environment
        run: uv sync --locked

      # Skip rather than fail when the secrets are absent, so an unconfigured
      # repo does not produce a weekly red X that means nothing.
      - name: Check for the secrets this suite needs
        id: secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            {
              echo "### Live suite skipped"
              echo
              echo "\`HF_TOKEN\` is not set. Add \`HF_TOKEN\`, \`LANGSMITH_API_KEY\`"
              echo "and \`WANDB_API_KEY\` as repository secrets to enable this run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Live suite
        if: steps.secrets.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          # Must be the exact literal "true"; langsmith compares it directly
          # with no stripping or case-folding (docs/findings.md F13).
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: my-agent
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WEAVE_PROJECT: my-agent
        # Redirect, never pipe: weave's teardown runs after pytest reports, so
        # `| tail` yields tail's exit status and none of the summary (F23).
        run: |
          uv run pytest -m live -q > live.log 2>&1 || {
            tail -40 live.log
            exit 1
          }
          tail -5 live.log

      # The eight checks in main.py, which nothing scheduled until now: they
      # are the only end-to-end measurement of the findings against a real
      # provider, and they ran solely when a human typed the command. Separate
      # from the step above because it is a separate program -- `-m live` is
      # two pytest tests and does not touch these.
      - name: Live checks (pass^k)
        if: steps.secrets.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: my-agent
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WEAVE_PROJECT: my-agent
          # Stated rather than inherited, so the schedule's k is visible here
          # and not only in main.py's default.
          LIVE_CHECK_REPEATS: "5"
        # Same redirect-never-pipe rule as above, same reason (F23): weave's
        # teardown runs after the program reports, so `| tail` would yield
        # tail's exit status and discard the tally.
        run: |
          uv run my-agent > checks.log 2>&1 || {
            tail -60 checks.log
            exit 1
          }
          tail -20 checks.log
