[project]
name = "my-agent"
version = "0.1.0"
description = "A contract- and eval-driven deep-agent harness on deepagents, with the domain deliberately undecided"
readme = "README.md"
authors = [
    { name = "objones25", email = "59661118+objones25@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.17",
    "langchain-openai>=1.6.2",
    "langsmith>=0.12.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "weave>=0.53.9",
]

[project.scripts]
my-agent = "my_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --doctest-modules -m 'not live and not eval'"
testpaths = ["tests", "src", "evals"]
asyncio_mode = "auto"
markers = [
    "live: hits a real network endpoint (HF router, LangSmith, W&B). Deselected by default.",
    "eval: an eval-suite case, not a unit test. Deselected by default.",
]
filterwarnings = [
    "error",
    # Scoped, not widened (CLAUDE.md: "fix it or scope an ignore, do not widen
    # the setting"). weave.init()'s background HTTP client (used by its
    # login/trace-upload sender thread) can leave an ssl.SSLSocket for the
    # garbage collector to finalize. Python's GC turns that into a
    # ResourceWarning delivered through sys.unraisablehook, and pytest's own
    # unraisableexception plugin collects those and re-emits them as
    # warnings.warn(pytest.PytestUnraisableExceptionWarning(...)) from
    # _pytest.unraisableexception — sometimes during a test's own call phase,
    # sometimes only at the pytest *session's* teardown
    # (pytest_unconfigure), which is why no per-test
    # @pytest.mark.filterwarnings mark can reliably reach it (see
    # docs/findings.md F11). Not caused by this repo's code. Matched on
    # category, message, and originating module together so this cannot mask
    # an unrelated PytestUnraisableExceptionWarning or ResourceWarning raised
    # anywhere else.
    'ignore:Exception ignored in.*SSLSocket:pytest.PytestUnraisableExceptionWarning:_pytest\.unraisableexception',
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Vendored audit tool: refreshed from the skill, not maintained here.
extend-exclude = ["scripts/audit_negative_space.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "ASYNC", "S", "RET", "PL", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false
files = ["src", "tests"]

# Second type checker, on purpose. mypy and pyright disagree about what satisfies a
# protocol variable (docs/findings.md F16), and that divergence shipped once already:
# CI was green while the editor showed errors on merged code. Running both is what
# turns that into a build failure instead of a squiggle.
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
# Pinned, not inferred — pyright's default mode has moved between releases.
# NOT "strict", and not for noise reasons: strict reports 46 issues, of which
# reportUnnecessaryIsInstance flags the defensive `require(isinstance(...))` checks that
# negative-space programming exists to add, and reportPrivateUsage flags the deliberate
# `_permissions` access in agent.py. Strict here would argue against the architecture.
# The rest are reportUnknown* from untyped langgraph/deepagents surfaces. Measured
# 2026-09-17 with pyright 1.1.414; re-measure before changing this.
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
